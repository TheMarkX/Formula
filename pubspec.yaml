name: formula
description: "A pharmaceutical formulation game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  model_viewer_plus: ^1.10.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/models/
    - assets/icon/
    - assets/splash/

# ─────────────────────────────────────────────
# APP ICON
# ─────────────────────────────────────────────

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/icon.jpg"

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.jpg"

# ─────────────────────────────────────────────
# SPLASH SCREEN
# ─────────────────────────────────────────────

flutter_native_splash:
  color: "#000000"
  image: assets/splash/logo.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#000000"
    image: assets/splash/logo.png